<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SMART EXAM — Sistem Ujian Online & Manajemen Evaluasi Sekolah</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Chart.js for analytics -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { font-family: 'Inter', sans-serif; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #f1f5f9; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        button, a { cursor: pointer; position: relative; z-index: 10; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 antialiased selection:bg-blue-600 selection:text-white">

    <!-- Toast Notification Container -->
    <div id="toast-container" class="fixed top-5 right-5 z-50 flex flex-col gap-2 pointer-events-none"></div>

    <!-- MAIN APP WRAPPER -->
    <div id="app" class="min-h-screen flex flex-col">
        <!-- Application will mount here upon window load -->
    </div>

    <!-- JAVASCRIPT APPLICATION CORE -->
    <script>
        const STORAGE_KEY = 'smart_exam_db_v6';

        const defaultData = {
            currentUser: null,
            config: {
                schoolName: 'SMA Negeri 1 Unggulan Nusantara',
                npsn: '20101234',
                subscription: 'Aktif (Enterprise Pro - 365 Hari Lagi)',
                appName: 'SMART EXAM',
                contactPhone: '+6281234567890',
                schoolLocation: 'Jl. Pendidikan No. 45, Jakarta',
                socialFacebook: 'https://facebook.com/smartexam',
                socialInstagram: 'https://instagram.com/smartexam',
                socialYoutube: 'https://youtube.com/@smartexam'
            },
            users: [
                { id: 'u1', name: 'Dr. H. Supriyanto, M.Pd', username: 'admin', password: 'password123', role: 'admin', email: 'admin@smartexam.sch.id', class: '-', status: 'Aktif' },
                { id: 'u2', name: 'Siti Rahmawati, S.Pd', username: 'guru1', password: 'password123', role: 'teacher', email: 'siti@smartexam.sch.id', class: 'XII IPA 1', status: 'Aktif' },
                { id: 'u3', name: 'Ahmad Fauzi', username: 'siswa1', password: 'password123', role: 'student', email: 'ahmad@student.sch.id', class: 'XII IPA 1', status: 'Aktif' },
                { id: 'u4', name: 'Dewi Lestari', username: 'siswa2', password: 'password123', role: 'student', email: 'dewi@student.sch.id', class: 'XII IPA 1', status: 'Aktif' }
            ],
            exams: [
                { id: 'ex1', title: 'Ujian Akhir Semester Ganjil - Matematika Wajib', subject: 'Matematika', grade: 'XII IPA 1', teacher: 'Siti Rahmawati, S.Pd', date: '2026-11-20T08:00', duration: 90, token: 'MTK99', totalQuestions: 5, active: true, attachedFile: 'materi_mtk.docx' },
                { id: 'ex2', title: 'Tryout UTBK SNBT - Literasi Bahasa Indonesia', subject: 'Bahasa Indonesia', grade: 'XII IPS 1', teacher: 'Drs. Budi Santoso', date: '2026-11-22T10:30', duration: 60, token: 'BIN01', totalQuestions: 3, active: true, attachedFile: '' }
            ],
            questionBank: [
                { id: 'q1', subject: 'Matematika', type: 'multiple', question: 'Berapakah hasil dari 12 + 8 x 3 - 5?', options: ['31', '32', '35', '24'], answer: '31', weight: 20 },
                { id: 'q2', subject: 'Matematika', type: 'multiple', question: 'Jika f(x) = 2x + 3, maka nilai dari f(5) adalah...', options: ['10', '13', '15', '18'], answer: '13', weight: 20 }
            ],
            results: [
                { id: 'res1', studentId: 'u3', studentName: 'Ahmad Fauzi', examTitle: 'Ujian Akhir Semester Ganjil - Matematika Wajib', score: 85, correct: 4, wrong: 1, date: '2026-11-10', status: 'Selesai', violations: 0, violationDetails: 'Tidak ada pelanggaran tab' }
            ],
            activityLogs: []
        };

        function getDB() {
            const data = localStorage.getItem(STORAGE_KEY);
            if (!data) {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(defaultData));
                return defaultData;
            }
            try {
                return JSON.parse(data);
            } catch (e) {
                return defaultData;
            }
        }

        function saveDB(data) {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
        }

        let currentRoute = 'dashboard';
        let activeExamSession = null;
        let examTimerInterval = null;
        let tabSwitchCount = 0;

        function showToast(message, type = 'success') {
            const container = document.getElementById('toast-container');
            if (!container) return;
            const toast = document.createElement('div');
            const bgColors = {
                success: 'bg-emerald-600 text-white',
                error: 'bg-rose-600 text-white',
                warning: 'bg-amber-500 text-white',
                info: 'bg-blue-600 text-white'
            };
            const icons = {
                success: 'fa-circle-check',
                error: 'fa-circle-exclamation',
                warning: 'fa-triangle-exclamation',
                info: 'fa-circle-info'
            };
            toast.className = `pointer-events-auto flex items-center gap-3 px-4 py-3 rounded-xl shadow-xl font-medium text-sm transition transform translate-y-2 opacity-0 duration-300 ${bgColors[type] || bgColors.success}`;
            toast.innerHTML = `<i class="fa-solid ${icons[type] || icons.success} text-lg"></i><span>${message}</span>`;
            container.appendChild(toast);
            setTimeout(() => toast.classList.remove('translate-y-2', 'opacity-0'), 10);
            setTimeout(() => {
                toast.classList.add('translate-y-2', 'opacity-0');
                setTimeout(() => toast.remove(), 300);
            }, 3500);
        }

        function renderLoginModal() {
            return `
                <div class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4">
                    <div class="bg-white rounded-3xl shadow-2xl max-w-md w-full p-8 border border-slate-100">
                        <div class="text-center mb-8">
                            <div class="w-16 h-16 bg-blue-600 text-white rounded-2xl flex items-center justify-center mx-auto mb-4 shadow-lg shadow-blue-600/30">
                                <i class="fa-solid fa-graduation-cap text-3xl"></i>
                            </div>
                            <h1 class="text-2xl font-extrabold text-slate-800">SMART EXAM</h1>
                            <p class="text-sm text-slate-500 mt-1">Sistem Ujian Online & Manajemen Evaluasi Sekolah</p>
                        </div>

                        <form onsubmit="handleLogin(event)" class="space-y-4">
                            <div>
                                <label class="block text-xs font-semibold uppercase tracking-wider text-slate-600 mb-1.5">Username Pengguna</label>
                                <div class="relative">
                                    <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center text-slate-400">
                                        <i class="fa-solid fa-user"></i>
                                    </span>
                                    <input type="text" id="login-username" required placeholder="Masukkan username..." class="w-full bg-slate-50 border border-slate-300 rounded-xl pl-10 pr-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-blue-600 focus:bg-white transition">
                                </div>
                            </div>
                            <div>
                                <label class="block text-xs font-semibold uppercase tracking-wider text-slate-600 mb-1.5">Password</label>
                                <div class="relative">
                                    <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center text-slate-400">
                                        <i class="fa-solid fa-lock"></i>
                                    </span>
                                    <input type="password" id="login-password" required placeholder="••••••••" class="w-full bg-slate-50 border border-slate-300 rounded-xl pl-10 pr-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-blue-600 focus:bg-white transition">
                                </div>
                            </div>
                            <button type="submit" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-semibold py-3.5 rounded-xl shadow-lg shadow-blue-600/30 transition mt-2">Masuk ke Sistem</button>
                        </form>
                    </div>
                </div>
            `;
        }

        function handleLogin(e) {
            e.preventDefault();
            const username = document.getElementById('login-username').value.trim();
            const password = document.getElementById('login-password').value.trim();
            const db = getDB();

            const foundUser = db.users.find(u => u.username === username && u.password === password && u.status !== 'Non-Aktif');
            if (foundUser) {
                db.currentUser = foundUser;
                saveDB(db);
                showToast(`Selamat datang kembali, ${foundUser.name}!`, 'success');
                render();
            } else {
                showToast('Username atau password salah atau akun non-aktif!', 'error');
            }
        }

        function handleLogout() {
            const db = getDB();
            db.currentUser = null;
            saveDB(db);
            showToast('Anda telah keluar dari sistem.', 'info');
            render();
        }

        function render() {
            const db = getDB();
            const app = document.getElementById('app');
            if (!app) return;

            if (!db.currentUser) {
                app.innerHTML = renderLoginModal();
                return;
            }

            if (activeExamSession) {
                app.innerHTML = renderActiveExamInterface(db);
                return;
            }

            app.innerHTML = `
                <div class="flex min-h-screen">
                    <aside id="sidebar" class="fixed inset-y-0 left-0 z-40 w-64 bg-slate-900 text-slate-300 flex flex-col transition-transform duration-300 -translate-x-full md:translate-x-0 border-r border-slate-800">
                        <div class="p-6 flex items-center gap-3 border-b border-slate-800">
                            <div class="w-10 h-10 bg-blue-600 text-white rounded-xl flex items-center justify-center font-bold text-lg shadow-md">
                                <i class="fa-solid fa-graduation-cap"></i>
                            </div>
                            <div>
                                <h1 class="font-extrabold text-white text-base tracking-wide">${db.config.appName}</h1>
                                <p class="text-[10px] text-slate-400 uppercase tracking-widest font-medium">Ujian Online Sekolah</p>
                            </div>
                        </div>

                        <div class="p-4 m-3 bg-slate-800/80 rounded-2xl border border-slate-700/50 flex items-center gap-3">
                            <div class="w-10 h-10 bg-gradient-to-tr from-blue-600 to-indigo-600 text-white font-bold rounded-xl flex items-center justify-center text-sm shadow">
                                ${db.currentUser.name.charAt(0)}
                            </div>
                            <div class="overflow-hidden">
                                <h4 class="text-sm font-bold text-white truncate">${db.currentUser.name}</h4>
                                <span class="inline-block px-2 py-0.5 text-[10px] font-semibold bg-blue-500/20 text-blue-400 rounded-md uppercase tracking-wide">
                                    ${db.currentUser.role === 'admin' ? 'Super Admin' : db.currentUser.role === 'teacher' ? 'Guru Pengajar' : 'Peserta Didik'}
                                </span>
                            </div>
                        </div>

                        <nav class="flex-1 px-3 py-2 space-y-1 overflow-y-auto">
                            ${renderNavLinks(db.currentUser.role)}
                        </nav>

                        <div class="p-4 border-t border-slate-800">
                            <button onclick="handleLogout()" class="w-full flex items-center gap-3 px-4 py-2.5 rounded-xl text-rose-400 hover:bg-rose-500/10 font-medium text-sm transition">
                                <i class="fa-solid fa-power-off"></i>
                                <span>Keluar Sistem</span>
                            </button>
                        </div>
                    </aside>

                    <div class="flex-1 flex flex-col md:ml-64">
                        <header class="bg-white border-b border-slate-200 px-6 py-3 flex flex-col md:flex-row items-center justify-between sticky top-0 z-20 shadow-sm gap-2">
                            <div class="flex items-center gap-4 w-full md:w-auto justify-between md:justify-start">
                                <button onclick="toggleSidebar()" class="md:hidden text-slate-600 hover:text-blue-600 text-xl p-2">
                                    <i class="fa-solid fa-bars"></i>
                                </button>
                                <h2 class="text-lg font-bold text-slate-800 capitalize">${getRouteTitle(currentRoute)}</h2>
                            </div>

                            <div class="flex flex-wrap items-center gap-4 text-xs text-slate-600">
                                <div class="flex items-center gap-1.5 bg-slate-50 px-2.5 py-1.5 rounded-lg border border-slate-200">
                                    <i class="fa-solid fa-phone text-blue-600"></i>
                                    <span class="font-medium">${db.config.contactPhone}</span>
                                </div>
                                <div class="flex items-center gap-1.5 bg-slate-50 px-2.5 py-1.5 rounded-lg border border-slate-200">
                                    <i class="fa-solid fa-location-dot text-rose-600"></i>
                                    <span class="font-medium">${db.config.schoolLocation}</span>
                                </div>
                                <div class="flex items-center gap-2 text-slate-500">
                                    <a href="${db.config.socialFacebook}" target="_blank" class="hover:text-blue-600 transition"><i class="fa-brands fa-facebook text-sm"></i></a>
                                    <a href="${db.config.socialInstagram}" target="_blank" class="hover:text-pink-600 transition"><i class="fa-brands fa-instagram text-sm"></i></a>
                                    <a href="${db.config.socialYoutube}" target="_blank" class="hover:text-rose-600 transition"><i class="fa-brands fa-youtube text-sm"></i></a>
                                </div>
                            </div>
                        </header>

                        <main class="flex-1 p-6 md:p-8 max-w-7xl w-full mx-auto">
                            ${renderRouteContent(db, currentRoute)}
                        </main>
                    </div>
                </div>
            `;
        }

        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            if (sidebar) sidebar.classList.toggle('-translate-x-full');
        }

        function navigate(route) {
            currentRoute = route;
            render();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function getRouteTitle(route) {
            const titles = {
                dashboard: 'Dashboard Utama',
                createExam: 'Buat Ujian Baru',
                examList: 'Daftar Ujian',
                questionBank: 'Bank Soal Sekolah',
                formGenerator: 'Generator Google Form',
                tutorial: 'Tutorial Pembuatan Soal & Ujian',
                results: 'Hasil & Rekapitulasi Nilai Ujian',
                analytics: 'Analisis Nilai & Statistik Ujian',
                students: 'Data Siswa',
                teachers: 'Manajemen Data Guru & Admin',
                settings: 'Pengaturan Sekolah',
                download: 'Download Aplikasi',
                help: 'Pusat Bantuan'
            };
            return titles[route] || 'Dashboard';
        }

        function renderNavLinks(role) {
            const links = [
                { id: 'dashboard', label: 'Dashboard', icon: 'fa-house', roles: ['admin', 'teacher', 'student'] },
                { id: 'createExam', label: 'Buat Ujian', icon: 'fa-file-circle-plus', roles: ['admin', 'teacher'] },
                { id: 'examList', label: 'Daftar Ujian', icon: 'fa-file-lines', roles: ['admin', 'teacher', 'student'] },
                { id: 'questionBank', label: 'Bank Soal Sekolah', icon: 'fa-database', roles: ['admin', 'teacher'] },
                { id: 'formGenerator', label: 'Generator Google Form', icon: 'fa-wand-magic-sparkles', roles: ['admin', 'teacher'] },
                { id: 'tutorial', label: 'Tutorial Soal', icon: 'fa-book-open', roles: ['admin', 'teacher', 'student'] },
                { id: 'results', label: 'Hasil & Rekap Nilai', icon: 'fa-square-poll-vertical', roles: ['admin', 'teacher', 'student'] },
                { id: 'analytics', label: 'Analisis Nilai', icon: 'fa-chart-pie', roles: ['admin', 'teacher'] },
                { id: 'students', label: 'Data Siswa', icon: 'fa-user-graduate', roles: ['admin', 'teacher'] },
                { id: 'teachers', label: 'Data Guru & Admin', icon: 'fa-chalkboard-user', roles: ['admin'] },
                { id: 'settings', label: 'Pengaturan Sekolah', icon: 'fa-gear', roles: ['admin'] },
                { id: 'download', label: 'Download Aplikasi', icon: 'fa-download', roles: ['admin', 'teacher', 'student'] },
                { id: 'help', label: 'Pusat Bantuan', icon: 'fa-circle-question', roles: ['admin', 'teacher', 'student'] }
            ];

            return links
                .filter(l => l.roles.includes(role))
                .map(l => `
                    <button onclick="navigate('${l.id}')" class="w-full flex items-center gap-3 px-4 py-3 rounded-xl font-medium text-sm transition ${currentRoute === l.id ? 'bg-blue-600 text-white shadow-lg shadow-blue-600/30' : 'text-slate-300 hover:bg-slate-800 hover:text-white'}">
                        <i class="fa-solid ${l.icon} w-5 text-center"></i>
                        <span>${l.label}</span>
                    </button>
                `).join('');
        }

        function renderRouteContent(db, route) {
            switch (route) {
                case 'dashboard': return renderDashboard(db);
                case 'createExam': return renderCreateExam(db);
                case 'examList': return renderExamList(db);
                case 'questionBank': return renderQuestionBank(db);
                case 'formGenerator': return renderFormGenerator(db);
                case 'tutorial': return renderTutorial(db);
                case 'results': return renderResults(db);
                case 'analytics': return renderAnalytics(db);
                case 'students': return renderStudents(db);
                case 'teachers': return renderTeachers(db);
                case 'settings': return renderSettings(db);
                case 'download': return renderDownload(db);
                case 'help': return renderHelp(db);
                default: return renderDashboard(db);
            }
        }

        function renderDashboard(db) {
            const isStudent = db.currentUser.role === 'student';
            if (isStudent) {
                return `
                    <div class="space-y-6">
                        <div class="bg-gradient-to-r from-blue-600 to-indigo-600 rounded-3xl p-8 text-white shadow-xl flex flex-col md:flex-row items-center justify-between gap-6">
                            <div class="space-y-2">
                                <span class="bg-white/20 text-white text-xs font-semibold px-3 py-1 rounded-full">Kelas: ${db.currentUser.class || 'XII IPA 1'}</span>
                                <h2 class="text-2xl md:text-3xl font-extrabold">Halo, ${db.currentUser.name}!</h2>
                                <p class="text-blue-100 text-sm">Siap untuk mengikuti ujian hari ini? Masukkan token ujian yang diberikan oleh guru pengawas.</p>
                            </div>
                            <button onclick="navigate('examList')" class="bg-white text-blue-600 hover:bg-blue-50 font-bold px-6 py-3.5 rounded-xl shadow-lg transition">Mulai Ujian</button>
                        </div>
                    </div>
                `;
            }

            return `
                <div class="space-y-6">
                    <div class="bg-gradient-to-r from-blue-700 to-indigo-800 rounded-3xl p-8 text-white shadow-xl flex flex-col md:flex-row items-center justify-between gap-6">
                        <div class="space-y-2">
                            <span class="bg-blue-500/30 text-blue-200 text-xs font-semibold px-3 py-1 rounded-full border border-blue-400/30">NPSN: ${db.config.npsn}</span>
                            <h2 class="text-2xl md:text-3xl font-extrabold">${db.config.schoolName}</h2>
                            <p class="text-blue-100 text-sm max-w-xl">Platform ujian online terpadu dengan integrasi bank soal, generator Google Form, serta analisis nilai otomatis dan proteksi anti-kecurangan.</p>
                        </div>
                        <div class="flex gap-3">
                            <button onclick="navigate('createExam')" class="bg-white text-blue-700 hover:bg-blue-50 font-bold px-5 py-3 rounded-xl shadow-lg transition text-sm flex items-center gap-2">
                                <i class="fa-solid fa-plus-circle"></i> Buat Ujian Baru
                            </button>
                        </div>
                    </div>

                    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6">
                        <div class="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm flex items-center gap-4">
                            <div class="w-14 h-14 bg-blue-50 text-blue-600 rounded-2xl flex items-center justify-center text-2xl font-bold"><i class="fa-solid fa-file-lines"></i></div>
                            <div><span class="text-xs text-slate-500 font-medium">Total Ujian</span><h3 class="text-2xl font-extrabold text-slate-800">${db.exams.length}</h3></div>
                        </div>
                        <div class="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm flex items-center gap-4">
                            <div class="w-14 h-14 bg-emerald-50 text-emerald-600 rounded-2xl flex items-center justify-center text-2xl font-bold"><i class="fa-solid fa-database"></i></div>
                            <div><span class="text-xs text-slate-500 font-medium">Jumlah Soal</span><h3 class="text-2xl font-extrabold text-slate-800">${db.questionBank.length}</h3></div>
                        </div>
                        <div class="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm flex items-center gap-4">
                            <div class="w-14 h-14 bg-indigo-50 text-indigo-600 rounded-2xl flex items-center justify-center text-2xl font-bold"><i class="fa-solid fa-user-graduate"></i></div>
                            <div><span class="text-xs text-slate-500 font-medium">Jumlah Peserta</span><h3 class="text-2xl font-extrabold text-slate-800">${db.users.filter(u => u.role === 'student').length}</h3></div>
                        </div>
                        <div class="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm flex items-center gap-4">
                            <div class="w-14 h-14 bg-amber-50 text-amber-600 rounded-2xl flex items-center justify-center text-2xl font-bold"><i class="fa-solid fa-bolt"></i></div>
                            <div><span class="text-xs text-slate-500 font-medium">Ujian Aktif</span><h3 class="text-2xl font-extrabold text-slate-800">${db.exams.filter(e => e.active).length}</h3></div>
                        </div>
                    </div>
                </div>
            `;
        }

        function renderCreateExam(db) {
            return `
                <div class="max-w-3xl mx-auto bg-white p-8 rounded-2xl border border-slate-200 shadow-sm space-y-6">
                    <div>
                        <h3 class="text-xl font-bold text-slate-800">Buat Ujian Baru & Upload File Soal</h3>
                        <p class="text-xs text-slate-500">Isi parameter ujian online lengkap dengan unggah dokumen materi/soal pendukung (.docx, .xlsx, .pdf).</p>
                    </div>
                    <form onsubmit="handleSaveNewExam(event)" class="space-y-4">
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                            <div><label class="block text-xs font-medium text-slate-700 mb-1">Judul Ujian</label><input type="text" id="ex-title" required class="w-full bg-slate-50 border border-slate-300 rounded-xl px-4 py-2.5 text-sm"></div>
                            <div><label class="block text-xs font-medium text-slate-700 mb-1">Mata Pelajaran</label><input type="text" id="ex-subject" required class="w-full bg-slate-50 border border-slate-300 rounded-xl px-4 py-2.5 text-sm"></div>
                        </div>
                        <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                            <div><label class="block text-xs font-medium text-slate-700 mb-1">Kelas</label><input type="text" id="ex-grade" required class="w-full bg-slate-50 border border-slate-300 rounded-xl px-4 py-2.5 text-sm"></div>
                            <div><label class="block text-xs font-medium text-slate-700 mb-1">Jadwal Ujian</label><input type="datetime-local" id="ex-date" required class="w-full bg-slate-50 border border-slate-300 rounded-xl px-4 py-2.5 text-sm"></div>
                            <div><label class="block text-xs font-medium text-slate-700 mb-1">Durasi (Menit)</label><input type="number" id="ex-duration" required value="90" class="w-full bg-slate-50 border border-slate-300 rounded-xl px-4 py-2.5 text-sm"></div>

        function handleUpdateExam(e) {
            e.preventDefault();
            const id = document.getElementById('edit-ex-id').value;

            const token = document.getElementById('edit-ex-token').value;
            const duration = parseInt(document.getElementById('edit-ex-duration').value);
            const date = document.getElementById('edit-ex-date').value;

            const db = getDB();
            const idx = db.exams.findIndex(e => e.id === id);
            if (idx > -1) {

                db.exams[idx].token = token;
                db.exams[idx].duration = duration;
                db.exams[idx].date = date;

            closeEditExamModal();
            render();
        }

            const id = document.getElementById('st-id').value;
            const name = document.getElementById('st-name').value;
            const username = document.getElementById('st-username').value;
            const password = document.getElementById('st-password').value;
            const studentClass = document.getElementById('st-class').value;

            const db = getDB();
            if (id) {
                const u = db.users.find(usr => usr.id === id);
                if (u) {
                    u.name = name;
                    u.username = username;
                    u.password = password;
                    u.class = studentClass;
                }
                showToast('Data siswa berhasil diperbarui!', 'success');
            } else {
                db.users.push({
                    id: 'u_' + Date.now(),
                    name,
                    username,
                    password,
                    role: 'student',
                    email: username + '@student.sch.id',
                    class: studentClass,
                    status: 'Aktif'
                });
                showToast('Siswa baru berhasil ditambahkan!', 'success');
            }
            saveDB(db);
            closeStudentModal();
            render();
        }

        function renderTeachers(db) {
            const teachers = db.users.filter(u => u.role === 'teacher' || u.role === 'admin');
            return `
                <div class="space-y-6">
                    <div>
                        <h3 class="text-xl font-bold text-slate-800">Manajemen Data Guru & Admin</h3>
                        <p class="text-xs text-slate-500">Kelola akun pengajar dan administrator sistem.</p>
                    </div>
                    <div class="bg-white rounded-2xl border border-slate-200 overflow-hidden shadow-sm">
                        <table class="w-full text-left">
                            <tr class="bg-slate-50 text-xs text-slate-600 border-b border-slate-200">
                                <th class="p-4">Nama Pengguna</th>
                                <th class="p-4">Username & Email</th>
                                <th class="p-4">Role</th>
                                <th class="p-4 text-center">Status</th>
                            </tr>
                            ${teachers.map(t => `
                                <tr class="border-b border-slate-100 text-sm hover:bg-slate-50/50 transition">
                                    <td class="p-4 font-bold text-slate-800">${t.name}</td>
                                    <td class="p-4 text-xs text-slate-600">${t.username} / ${t.email}</td>
                                    <td class="p-4 uppercase text-xs font-bold text-blue-600">${t.role}</td>
                                    <td class="p-4 text-center"><span class="bg-emerald-100 text-emerald-700 px-3 py-1 rounded-full text-xs font-semibold">Aktif</span></td>
                                </tr>
                            `).join('')}
                        </table>
                    </div>
                </div>
            `;
        }

        function renderSettings(db) {
            return `
                <div class="max-w-3xl mx-auto bg-white p-8 rounded-2xl border border-slate-200 shadow-sm space-y-6">
                    <div>
                        <h3 class="text-xl font-bold text-slate-800">Pengaturan Sekolah & Kontak</h3>
                        <p class="text-xs text-slate-500">Sesuaikan informasi sekolah, nomor kontak, lokasi, dan media sosial.</p>
                    </div>
                    <form onsubmit="handleSaveSettings(event)" class="space-y-4">
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                            <div><label class="block text-xs font-medium text-slate-700 mb-1">Nama Sekolah</label><input type="text" id="cfg-school" value="${db.config.schoolName}" required class="w-full bg-slate-50 border border-slate-300 rounded-xl px-4 py-2.5 text-sm"></div>
                            <div><label class="block text-xs font-medium text-slate-700 mb-1">NPSN Sekolah</label><input type="text" id="cfg-npsn" value="${db.config.npsn}" required class="w-full bg-slate-50 border border-slate-300 rounded-xl px-4 py-2.5 text-sm"></div>
                        </div>
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                            <div><label class="block text-xs font-medium text-slate-700 mb-1">Nomor Kontak Sekolah (WhatsApp)</label><input type="text" id="cfg-phone" value="${db.config.contactPhone}" required class="w-full bg-slate-50 border border-slate-300 rounded-xl px-4 py-2.5 text-sm"></div>
                            <div><label class="block text-xs font-medium text-slate-700 mb-1">Lokasi / Alamat Sekolah</label><input type="text" id="cfg-location" value="${db.config.schoolLocation}" required class="w-full bg-slate-50 border border-slate-300 rounded-xl px-4 py-2.5 text-sm"></div>
                        </div>
                        <button type="submit" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-semibold py-3 rounded-xl shadow transition">Simpan Pengaturan Sekolah</button>
                    </form>
                </div>
            `;
        }

        function handleSaveSettings(e) {
            e.preventDefault();
            const db = getDB();
            db.config.schoolName = document.getElementById('cfg-school').value;
            db.config.npsn = document.getElementById('cfg-npsn').value;
            db.config.contactPhone = document.getElementById('cfg-phone').value;
            db.config.schoolLocation = document.getElementById('cfg-location').value;
            saveDB(db);
            showToast('Pengaturan sekolah berhasil diperbarui!', 'success');
            render();
        }

        function renderDownload(db) {
            return `
                <div class="max-w-3xl mx-auto bg-white p-8 rounded-2xl border border-slate-200 shadow-sm text-center space-y-6">
                    <div class="w-16 h-16 bg-blue-50 text-blue-600 rounded-3xl flex items-center justify-center mx-auto text-3xl">
                        <i class="fa-solid fa-download"></i>
                    </div>
                    <div class="space-y-2">
                        <h3 class="text-2xl font-bold text-slate-800">Download Aplikasi Klien SMART EXAM</h3>
                        <p class="text-sm text-slate-500">Unduh aplikasi aman untuk mencegah kecurangan ujian di perangkat Android atau Windows.</p>
                    </div>
                    <div class="flex flex-col sm:flex-row justify-center gap-4 pt-4">
                        <button onclick="downloadClientApp('Android (.apk)')" class="bg-emerald-600 hover:bg-emerald-500 text-white font-bold px-6 py-3.5 rounded-xl shadow-lg transition flex items-center justify-center gap-2">
                            <i class="fa-brands fa-android text-lg"></i> Download APK (Android)
                        </button>
                        <button onclick="downloadClientApp('Windows (.exe)')" class="bg-blue-600 hover:bg-blue-500 text-white font-bold px-6 py-3.5 rounded-xl shadow-lg transition flex items-center justify-center gap-2">
                            <i class="fa-brands fa-windows text-lg"></i> Download EXE (Windows)
                        </button>
                    </div>
                </div>
            `;
        }

        function downloadClientApp(platform) {
            const content = `SMART EXAM Secure Client App for ${platform}\nInstalled and configured for ${getDB().config.schoolName}.\nVersion: 5.0.0 Enterprise`;
            const blob = new Blob([content], { type: 'text/plain' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = platform.includes('Android') ? 'SmartExam_Secure_Client.apk' : 'SmartExam_Secure_Client.exe';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
            showToast(`Mengunduh installer ${platform}... Berhasil!`, 'success');
        }

        function renderHelp(db) {
            return `
                <div class="max-w-3xl mx-auto bg-white p-8 rounded-2xl border border-slate-200 shadow-sm space-y-6">
                    <div>
                        <h3 class="text-xl font-bold text-slate-800">Pusat Bantuan & Layanan Sekolah</h3>
                        <p class="text-xs text-slate-500">Hubungi tim admin sekolah secara langsung melalui WhatsApp.</p>
                    </div>
                    <div class="p-6 bg-slate-50 rounded-2xl border border-slate-200 flex items-center justify-between">
                        <div class="space-y-1">
                            <h4 class="font-bold text-slate-800">Admin Sekolah / Helpdesk</h4>
                            <p class="text-xs text-slate-500">Nomor WhatsApp: ${db.config.contactPhone}</p>
                        </div>
                        <a href="https://wa.me/${db.config.contactPhone.replace(/[^0-9]/g, '')}?text=Halo%20Admin%20Smart%20Exam,%20saya%20butuh%20bantuan." target="_blank" class="bg-emerald-600 hover:bg-emerald-500 text-white font-bold px-6 py-3 rounded-xl shadow transition flex items-center gap-2">
                            <i class="fa-brands fa-whatsapp text-lg"></i> Chat WhatsApp
                        </a>
                    </div>
                </div>
            `;
        }

        function toggleUserStatus(id) {
            const db = getDB();
            const u = db.users.find(usr => usr.id === id);
            if (u) {
                u.status = u.status === 'Non-Aktif' ? 'Aktif' : 'Non-Aktif';
                saveDB(db);
                showToast(`Status pengguna ${u.name} diubah menjadi ${u.status}.`, 'success');
                render();
            }
        }

        function deleteUser(id) {
            const db = getDB();
            db.users = db.users.filter(u => u.id !== id);
            saveDB(db);
            showToast('Pengguna berhasil dihapus.', 'success');
            render();
        }

        function startExamSession(examId) {
            const db = getDB();
            const ex = db.exams.find(e => e.id === examId);
            if (!ex.active) {
                showToast('Ujian ini sedang tidak aktif!', 'error');
                return;
            }
            const token = prompt(`Masukkan Token Ujian "${ex.title}":`);
            if (token === ex.token) {
                activeExamSession = {
                    exam: ex,
                    questions: db.questionBank.slice(0, ex.totalQuestions),
                    answers: {},
                    timeLeft: ex.duration * 60
                };
                tabSwitchCount = 0;
                window.examViolationLogs = [];
                document.addEventListener('visibilitychange', handleVisibilityChange);
                window.addEventListener('blur', handleWindowBlur);
                showToast('Token benar! Ujian dimulai dengan proteksi anti-kecurangan aktif.', 'success');
                render();
            } else if (token !== null) {
                showToast('Token salah! Periksa kembali.', 'error');
            }
        }

        function handleVisibilityChange() {
            if (document.hidden && activeExamSession) {
                recordViolation("Berpindah tab browser");
            }
        }

        function handleWindowBlur() {
            if (activeExamSession) {
                recordViolation("Keluar dari jendela ujian / fokus hilang");
            }
        }

        function recordViolation(actionType) {
            tabSwitchCount++;
            const timestampStr = new Date().toLocaleTimeString();
            const violationDetail = `[${timestampStr}] ${actionType} (Pelanggaran ke-${tabSwitchCount})`;
            if (!window.examViolationLogs) window.examViolationLogs = [];
            window.examViolationLogs.push(violationDetail);
            
            const badge = document.getElementById('violation-badge');
            if (badge) badge.innerText = tabSwitchCount;

            showToast(`PENTING: Terdeteksi aktivitas mencurigakan (${actionType})! Dicatat oleh guru.`, 'warning');
        }

        function renderActiveExamInterface(db) {
            const session = activeExamSession;
            const exam = session.exam;
            const qList = session.questions;

            return `
                <div class="max-w-4xl mx-auto space-y-6">
                    <div class="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm flex items-center justify-between">
                        <div>
                            <span class="text-xs font-semibold text-blue-600 bg-blue-50 px-2.5 py-1 rounded-md">${exam.subject}</span>
                            <h3 class="text-xl font-bold text-slate-800 mt-1">${exam.title}</h3>
                            <p class="text-xs text-rose-600 font-semibold mt-1"><i class="fa-solid fa-shield-halved"></i> Anti-Contek Aktif (Pelanggaran Tab: <span id="violation-badge" class="font-bold underline">${tabSwitchCount}</span>x)</p>
                        </div>
                        <div class="bg-slate-900 text-white px-5 py-3 rounded-2xl text-center shadow">
                            <span class="block text-[10px] uppercase text-slate-400 font-medium">Sisa Waktu</span>
                            <span id="exam-timer" class="text-xl font-mono font-bold">${Math.floor(session.timeLeft / 60)}:00</span>
                        </div>
                    </div>

                    <div class="space-y-4">
                        ${qList.map((q, idx) => `
                            <div class="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm space-y-3">
                                <span class="text-xs font-bold text-slate-400">Soal Nomor ${idx + 1} (${q.weight} Poin)</span>
                                <p class="text-slate-800 font-medium text-base">${q.question}</p>
                                <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 pt-2">
                                    ${q.options.map(opt => `
                                        <label class="flex items-center gap-3 p-3.5 rounded-xl border border-slate-200 bg-slate-50 hover:bg-blue-50/50 cursor-pointer transition">
                                            <input type="radio" name="q_${q.id}" value="${opt}" ${session.answers[q.id] === opt ? 'checked' : ''} onchange="recordAnswer('${q.id}', '${opt}')" class="text-blue-600 focus:ring-blue-500">
                                            <span class="text-sm text-slate-700">${opt}</span>
                                        </label>
                                    `).join('')}
                                </div>
                            </div>
                        `).join('')}
                    </div>

                    <div class="flex justify-end pt-4">
                        <button onclick="submitExamSession()" class="bg-emerald-600 hover:bg-emerald-500 text-white font-bold px-8 py-3.5 rounded-2xl shadow-lg shadow-emerald-600/30 transition">Selesai & Kumpulkan Ujian</button>
                    </div>
                </div>
            `;
        }

        function recordAnswer(qId, val) {
            if (activeExamSession) {
                activeExamSession.answers[qId] = val;
            }
        }

        function submitExamSession() {
            if (!confirm('Apakah Anda yakin ingin mengumpulkan jawaban ujian ini?')) return;
            const session = activeExamSession;
            const db = getDB();

            let score = 0;
            let correct = 0;
            let wrong = 0;

            session.questions.forEach(q => {
                const userAns = session.answers[q.id];
                if (userAns === q.answer) {
                    score += q.weight;
                    correct++;
                } else {
                    wrong++;
                }
            });

            const violationSummary = window.examViolationLogs && window.examViolationLogs.length > 0 
                ? window.examViolationLogs.join(' | ') 
                : 'Tidak ada pelanggaran tab';

            db.results.push({
                id: 'res_' + Date.now(),
                studentId: db.currentUser.id,
                studentName: db.currentUser.name,
                examTitle: session.exam.title,
                score,
                correct,
                wrong,
                date: new Date().toISOString().split('T')[0],
                status: 'Selesai',
                violations: tabSwitchCount,
                violationDetails: violationSummary
            });

            saveDB(db);
            document.removeEventListener('visibilitychange', handleVisibilityChange);
            window.removeEventListener('blur', handleWindowBlur);
            activeExamSession = null;
            window.examViolationLogs = [];
            showToast('Ujian berhasil dikumpulkan dan dinilai otomatis!', 'success');
            render();
        }

        window.onload = function() {
            render();
        };
    </script>
</body>
</html>
